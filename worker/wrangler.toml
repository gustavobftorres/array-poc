name = "array-poc-worker"
main = "src/index.ts"
compatibility_date = "2024-12-30"

[[d1_databases]]
binding = "DB"
database_name = "array_poc"
database_id = "local-array-poc"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "local-cache"

[vars]
# Defaults públicos (segredos vivem em worker/.dev.vars / secrets, nunca aqui).
#
# ARRAY_ENV NÃO é fixado aqui de propósito (W2-001, ciclo 15): fixá-lo tornava
# inalcançável o ramo "o host efetivo decide o ambiente" — quem apontasse
# ARRAY_BASE_URL para produção continuava vendo "sandbox" no Dashboard e o CDN
# de sandbox. Sem ARRAY_BASE_URL o default do código já é sandbox; com ela, o
# host manda. Defina ARRAY_ENV no seu .env só quando quiser produção SEM
# ARRAY_BASE_URL.
ARRAY_AUTH_MODE = "server"
ARRAY_PRODUCT_CODE = "credmo3bReportScore"
# Unidade em SEGUNDOS: // UNVERIFIED (a Array não publica valores recomendados).
ARRAY_POLL_INTERVAL = "1.0"
ARRAY_POLL_TIMEOUT = "120"
